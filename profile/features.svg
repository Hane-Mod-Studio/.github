<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 216" width="840" height="216" role="img" aria-label="Gameplay, interface and server tools">
  <style>
    .t { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .card { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
    .c2 { animation-delay: .12s; }
    .c3 { animation-delay: .24s; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: 3.5px; fill: #7a7a7a; }
    .item { font-size: 15px; font-weight: 500; fill: #ededed; }
    @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <g class="card">
    <rect x="0" y="0" width="264" height="216" rx="10" fill="#0e0e10"/>
    <rect x="28" y="33" width="3" height="14" fill="#ededed"/>
    <text class="t label" x="42" y="44">GAMEPLAY</text>
    <text class="t item" x="28" y="88">Multicharacter</text>
    <text class="t item" x="28" y="118">Rentals</text>
    <text class="t item" x="28" y="148">Minigames</text>
    <text class="t item" x="28" y="178">Chat</text>
  </g>
  <g class="card c2">
    <rect x="288" y="0" width="264" height="216" rx="10" fill="#0e0e10"/>
    <rect x="316" y="33" width="3" height="14" fill="#ededed"/>
    <text class="t label" x="330" y="44">INTERFACE</text>
    <text class="t item" x="316" y="88">HUD</text>
    <text class="t item" x="316" y="118">Inventory</text>
    <text class="t item" x="316" y="148">Loading screens</text>
    <text class="t item" x="316" y="178">Menus</text>
  </g>
  <g class="card c3">
    <rect x="576" y="0" width="264" height="216" rx="10" fill="#0e0e10"/>
    <rect x="604" y="33" width="3" height="14" fill="#ededed"/>
    <text class="t label" x="618" y="44">SERVER TOOLS</text>
    <text class="t item" x="604" y="88">Web panels</text>
    <text class="t item" x="604" y="118">Discord integrations</text>
    <text class="t item" x="604" y="148">Game bridge</text>
    <text class="t item" x="604" y="178">Admin tools</text>
  </g>
</svg>
