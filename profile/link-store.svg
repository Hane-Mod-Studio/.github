<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 84" width="272" height="84" role="img" aria-label="TEBEX STORE: hanemods.com">
  <style>
    .t { font-family: 'Space Grotesk', Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .card { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) 0s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <g class="card">
    <rect width="272" height="84" rx="4" fill="#131417"/>
    <rect x="24" y="23" width="3" height="12" fill="#e8ad3c"/>
    <text class="t" x="36" y="33" font-size="11" font-weight="600" letter-spacing="3.5" fill="#8f8a83">TEBEX STORE</text>
    <text class="t" x="24" y="62" font-size="17" font-weight="700" fill="#f5f0e8">hanemods.com</text>
  </g>
</svg>