<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-label="Hane Mod Studio">
  <defs>
    <radialGradient id="base" cx="0.15" cy="0" r="1.1">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="0.55" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#070708"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="840" height="280" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .t { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { opacity: 0; animation: rise 1s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .15s; }
    .d2 { animation-delay: .3s; }
    .d3 { animation-delay: .45s; }
    .d4 { animation-delay: .7s; }
    .bar { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: grow .9s cubic-bezier(.22,1,.36,1) .1s forwards; }
    .glow { animation: drift 16s ease-in-out infinite alternate; }
    .mark { opacity: 0; animation: fade 2s ease .4s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-160px, 40px); } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="840" height="280" fill="url(#base)"/>
    <ellipse class="glow" cx="700" cy="60" rx="320" ry="220" fill="url(#glow)"/>
    <text class="t mark" x="470" y="250" font-size="230" font-weight="900" letter-spacing="-10" fill="#ffffff" fill-opacity="0.035">HANE</text>
    <rect class="bar" x="56" y="74" width="3" height="112" fill="#ededed"/>
    <text class="t rise d1" x="82" y="92" font-size="12" font-weight="600" letter-spacing="4.5" fill="#7a7a7a">FIVEM RESOURCES</text>
    <text class="t rise d2" x="80" y="148" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#ededed">HANE MOD STUDIO</text>
    <text class="t rise d3" x="82" y="184" font-size="16" font-weight="400" fill="#a1a1aa">Scripts and interfaces for Qbox servers</text>
    <text class="t rise d4" x="82" y="238" font-size="11" font-weight="600" letter-spacing="3.5" fill="#5f5f69">QBX_CORE      OX_LIB      OX_INVENTORY      OXMYSQL</text>
  </g>
</svg>
